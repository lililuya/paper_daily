name: qianyan-daily

on:
  schedule:
    # UTC 15:00 = 北京时间 23:00，覆盖 arXiv 当日更新
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qianyan-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnose network access to arXiv (temporary)
        run: |
          API='https://export.arxiv.org/api/query?search_query=cat:cs.CV&max_results=1'
          API2='https://arxiv.org/api/query?search_query=cat:cs.CV&max_results=1'
          LIST='https://arxiv.org/list/cs.CV/new'
          test_url() {
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" "$1")
            echo "  $code  $1"
          }
          echo "== direct =="
          test_url "$API"; test_url "$API2"; test_url "$LIST"
          echo "== via allorigins =="
          test_url "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$API',safe=''))")"
          echo "== via codetabs =="
          test_url "https://api.codetabs.com/v1/proxy?quest=$(python3 -c "import urllib.parse;print(urllib.parse.quote('$API',safe=''))")"
          echo "== via jina reader (raw header) =="
          code=$(curl -s -o /tmp/jina.out -w "%{http_code}" -m 60 -H "x-return-format: html" "https://r.jina.ai/$API")
          echo "  $code  r.jina.ai (body head: $(head -c 120 /tmp/jina.out | tr '\n' ' '))"
          echo "== runner IP =="
          curl -s -m 15 https://api.github.com/meta | head -c 0; curl -s -m 15 ifconfig.me || true; echo

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        run: |
          python run_pipeline.py

      - name: Commit daily data
        run: |
          git config user.name "qianyan-bot"
          git config user.email "actions@github.com"
          git add -f data/ assets/file-list.txt || true
          if git diff --staged --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "daily: $(date -u +%F) frontier research digest"
            git push
          fi

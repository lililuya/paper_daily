name: qianyan-daily

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30。arXiv 每日新论文在北京时间早上 8 点左右发布，
    # 此时抓取可拿到当天全部新提交；放在晚上抓只会重复同批论文（去重后 0 新增）。
    # 且早间运行即使有 GitHub cron 延迟也不会跨日，文件日期与 commit 日期一致。
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "额外命令行参数（如 --no-dedup）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qianyan-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MAX_LLM_PAPERS: ${{ vars.MAX_LLM_PAPERS }}
        run: |
          python run_pipeline.py ${{ inputs.args || '' }}

      - name: Commit daily data
        run: |
          git config user.name "qianyan-bot"
          git config user.email "actions@github.com"
          git add -f data/ assets/file-list.txt assets/blog-list.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无新数据，跳过提交"
          else
            git commit -m "daily: $(date -u +%F) frontier research digest"
            git push
          fi
